const SNAP = 8 / 60;

// directional motion blur (SVG filter applied only while moving)
function dirBlur(el, t0, dur, peak, axis = "x", mode = "mid") {
  const id = "mb" + FID++;

  tl.set(el, { filter: `url(#${id})` }, t0);

  else if (mode === "in") { tl.to(p, { v: peak, duration: dur - 2 * FR, ease: "power2.in", onUpdate: upd }, t0); tl.to(p, { v: 0, duration: 2 * FR, ease: "none", onUpdate: upd }, t0 + dur - 2 * FR); }
  else { tl.to(p, { v: peak, duration: dur / 2, ease: "power2.in", onUpdate: upd }, t0); tl.to(p, { v: 0, duration: dur / 2, ease: "power2.out", onUpdate: upd }, t0 + dur / 2); }
  tl.set(el, { filter: "none" }, t0 + dur);
}
function cssBlur(el, t0, dur, peak) {
  tl.fromTo(el, { filter: "blur(0px)" }, { filter: `blur(${peak}px)`, duration: dur / 2, ease: "power2.in", immediateRender: false }, t0);

}
function markOv(root) { root.setAttribute("data-layout-allow-overlap", ""); root.querySelectorAll("*").forEach((e) => e.setAttribute("data-layout-allow-overlap", "")); }
function wipeOff(ov, t, frames = 4) { tl.fromTo(ov, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 100%)", duration: frames * FR, ease: "none", immediateRender: false }, t); }
function wipeIn(el, t, frames = 4, ease = "none") { tl.fromTo(el, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: frames * FR, ease, immediateRender: false }, t); }

function off(el, t) { tl.set(el, { autoAlpha: 0 }, t); }

// proxy-driven renderer: fn(t) for t in [t0,t1]
function drive(t0, t1, fn) {
  const p = { t: t0 };
  fn(t0);
  tl.to(p, { t: t1, duration: t1 - t0, ease: "none", onUpdate: () => fn(p.t) }, t0);
}
function typeText(el, text, t0, cps) {

}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
// monotone cubic interpolation
function mono(xs, ys) {
  const n = xs.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m.push(d[0]);
  for (let i = 1; i < n - 1; i++) m.push(d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2);
  m.push(d[n - 2]);
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], h = a * a + b * b;
    if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return (x) => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}

// ═════════════════════════ S06–S08 — staircase → van queue → departures pan → scatter ═════════════════════════
function S06() {
  const sc = q("s06");
  const tilt = layer(sc);
  const world = layer(tilt);
  const t0 = w("l03", 0);
  // merged word (final layout) measured first
  const row = mk(world, "left:0;top:420px;width:1920px;height:130px;display:flex;justify-content:center;align-items:center;direction:rtl");
  const chunks = ["مَرَّ", "ةً", "أُ", "خْرَ", "ى"].map((t, i) => { const d = document.createElement("div"); d.className = "ar"; d.style.cssText = "position:relative;font-size:104px;line-height:130px;color:" + C.ink + (i === 2 ? ";margin-right:30px" : ""); d.textContent = t; row.appendChild(d); return d; });
  const cr = chunks.map((e) => { const r = e.getBoundingClientRect(); return [(r.left + r.right) / 2, (r.top + r.bottom) / 2]; });
  // bars (minutes waited)
  const bars = [[860, 120, 150, C.blush], [990, 120, 236, C.coral], [1122, 128, 330, C.lilac], [1258, 132, 430, C.red], [1398, 138, 536, C.blush], [1546, 146, 650, C.coral], [1706, 160, 770, C.lilac]];
  const barEls = bars.map(([x, bw, bh, col], i) => {
    const b = mk(world, `left:${x - bw / 2}px;top:${1080 - bh}px;width:${bw}px;height:${bh + 200}px;background:${col};opacity:.86;border-radius:6px 6px 0 0`);
    gsap.set(b, { transformOrigin: "50% 100%" });
    cut(b, t0 + i * 2 * FR);
    return b;
  });
  // chunks on bars, reading right→left down the stair
  const onBar = [5, 4, 3, 2, 1];
  chunks.forEach((c, i) => {
    const b = bars[onBar[i]];
    gsap.set(c, { x: b[0] - cr[i][0], y: 1080 - b[2] - 62 - cr[i][1] });
    cut(c, t0 + (onBar[i]) * 2 * FR);
  });
  // tilt-up settle
  tl.fromTo(tilt, { y: 330 }, { y: 0, duration: 22 / 60, ease: "expo.out" }, t0 - 0.04);
  dirBlur(tilt, t0 - 0.04, 0.2, 14, "y");
  // merge
  const tM = w("l03", 3) - 0.22;
  chunks.forEach((c, i) => tl.to(c, { x: 0, y: 0, duration: 16 / 60, ease: "power3.out" }, tM + i * 2 * FR));
  barEls.forEach((b, i) => tl.to(b, { scaleY: 0.0, duration: 16 / 60, ease: "power3.in" }, tM + i * FR));
  // van queue (3D card stack)
  const stackW = mk(world, "left:0;top:0;width:1920px;height:1080px;perspective:1500px;perspective-origin:960px 600px");
  const stack = layer(stackW, "transform-style:preserve-3d");
  const sc6 = [[C.red, "#F7CFCE"], [C.coral, "#FBE1E1"], [C.red, "#F7CFCE"], [C.blush, "#FDF0F0"], [C.coral, "#FBE1E1"], [C.lilac, "#FDF3FE"]];
  const scards = sc6.map(([col, lt], i) => {
    const c = mk(stack, `left:${150 + i * 290}px;top:${575}px;width:600px;height:420px;border-radius:34px;background:${col};overflow:hidden`, S("0 0 600 420", gVanSide(40, 96, 1.32, { body: lt, stripe: col, win: col, rack: true, l1: lt, l2: lt, l3: lt, shadow: false })));
    gsap.set(c, { rotationY: -34, z: -i * 70, transformOrigin: "50% 100%", scaleY: 0 });
    tl.to(c, { scaleY: 1, duration: 16 / 60, ease: "power3.out" }, tM + 4 * FR + i * 2 * FR);
    return c;
  });
  // hold drift + skew, tilt (content rises), chunk pop-off
  tl.to(stack, { rotationZ: -2.5, x: -30, duration: 9.08 - tM, ease: "none" }, tM);
  gsap.set(tilt, { transformOrigin: "960px 540px" });
  tl.to(tilt, { scale: 1.06, duration: 9.08 - (t0 + 0.24), ease: "none" }, t0 + 0.24);
  const tR = 8.55;
  tl.to(tilt, { y: -210, duration: 0.5, ease: "sine.inOut" }, tR);
  [2, 0, 1, 3, 4].forEach((k, j) => off(chunks[k], 8.86 + j * 4 * FR));
  // diagonal card row (departures boards)
  const rowCols = [C.coral, C.blush, C.lilac, C.lav, C.sky, C.royal];
  const tags = [];
  const panY = 0.153;
  rowCols.forEach((col, i) => {
    const x = 2130 + 140 * i, y = 540 + 210 + panY * (x - 960) + 20;
    const holder = mk(world, `left:${x - 135}px;top:${y - 250}px;width:270px;height:500px;perspective:1100px`);
    const card = mk(holder, `left:0;top:0;width:270px;height:500px;border-radius:24px;background:${col};overflow:hidden;box-shadow:0 30px 60px -30px rgba(45,40,40,.4)`);
    gsap.set(card, { rotationY: 26, transformOrigin: "50% 50%" });
    if (i === 5) {
      card.innerHTML = S("0 0 270 500", `<circle cx="135" cy="250" r="118" fill="${C.sky}"/><circle cx="135" cy="250" r="78" fill="${C.royal}"/><rect x="135" y="196" width="140" height="108" fill="${C.royal}"/>`);
      mk(card, "left:85px;top:200px;width:100px;height:100px", ic("steering-wheel", "#fff", 100));
    } else if (i % 2 === 0) {
      const dark = i < 2 ? "#3A1F2A" : C.navyTile;
      card.innerHTML = S("0 0 270 500", `<g transform="translate(20 40)">${gBoard(230, 300, [["٠٧:٠٠", C.green], ["٠٧:٣٠", C.green], ["٠٨:١٥", C.green]], { bg: dark })}</g><rect x="20" y="380" width="230" height="16" rx="8" fill="#fff" opacity=".6"/><rect x="20" y="410" width="150" height="16" rx="8" fill="#fff" opacity=".4"/>`);
      [0, 1, 2].forEach((r) => {
        const yy = 40 + 300 * 0.27 + r * 300 * 0.15;
        const tg = mk(card, `left:${20 + 230 * 0.1}px;top:${yy + 4}px;width:${230 * 0.4}px;height:${300 * 0.08}px;border-radius:12px;background:${C.green};display:flex;align-items:center;justify-content:center;font-size:15px;color:#0F3B1F`, "في الموعد", "ar");
        const tr = mk(card, `left:${20 + 230 * 0.1}px;top:${yy + 4}px;width:${230 * 0.4}px;height:${300 * 0.08}px;border-radius:12px;background:${C.red};display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff`, "مُتَأَخِّر", "ar");
        hide(tr); tags.push(tr); tg.setAttribute("data-layout-allow-overlap", ""); tr.setAttribute("data-layout-allow-overlap", "");
      });
    } else {
      // van rear doors
      card.innerHTML = S("0 0 270 500", `<rect x="30" y="60" width="210" height="380" rx="28" fill="#fff"/><rect x="44" y="80" width="88" height="120" rx="12" fill="${C.win}"/><rect x="138" y="80" width="88" height="120" rx="12" fill="${C.win}"/><rect x="134" y="70" width="2" height="360" fill="rgba(45,40,40,.2)"/><rect x="30" y="250" width="210" height="18" fill="${C.red}"/><rect x="112" y="300" width="46" height="18" rx="4" fill="#fff" stroke="${C.ink}" stroke-width="3"/><rect x="40" y="320" width="34" height="20" rx="6" fill="${C.red}"/><rect x="196" y="320" width="34" height="20" rx="6" fill="${C.red}"/>`);
    }
  });
  tags.forEach((tg, i) => tl.set(tg, { autoAlpha: 1 }, w("l03", 6) + (i % 3) * 2 * FR));
  // S08 scatter layer (screen space, rides the pan)
  const p8 = layer(sc);
  const p8z = layer(p8);
  gsap.set(p8z, { transformOrigin: "960px 540px" });
  const ph = [
    [380, 300, 620, 440, ART.watch(), 0],
    [900, 170, 300, 300, ART.phone58(), 0],
    [1500, 290, 420, 290, ART.bench(), 0],
    [1300, 820, 330, 250, ART.suitcase(), 4],
    [1680, 780, 320, 250, ART.calendar(), 0],
  ];
  const phEls = ph.map(([cx, cy, cw, ch, art, bl]) => bx(p8z, cx, cy, cw, ch, bl ? `filter:blur(${bl}px)` : "", art, "card"));
  // pan: velocity profile → position
  const vk = [[9.08, 0], [9.16, 1270], [10.05, 1270], [10.2, 4000], [10.48, 4000], [10.64, 0]];
  const posAt = (t) => { let x = 0; for (let i = 0; i < vk.length - 1; i++) { const [a, va] = vk[i], [b, vb] = vk[i + 1]; if (t <= a) break; const tt = Math.min(t, b), k = (tt - a) / (b - a), v = va + (vb - va) * k; x += ((va + v) / 2) * (tt - a); } return x; };
  const PEND = posAt(11);
  drive(9.0, 10.7, (t) => {
    const P = posAt(t), rot = -1.6 * ss(9.08, 9.2, t) * (1 - ss(9.2, 9.7, t));
    world.style.transform = `translate(${-P}px, ${-P * panY}px) rotate(${rot}deg)`;
    p8.style.transform = `translate(${PEND - P + 0}px, ${(PEND - P) * panY}px)`;
  });
  dirBlur(world, 10.0, 0.62, 24, "x");
  dirBlur(p8, 10.0, 0.62, 24, "x");
  p8.setAttribute("data-layout-allow-overflow", "");
  // S08 beats
  tl.to(phEls[1], { scale: 1.07, duration: 0.08, ease: "power2.out" }, w("l03", 8));
  tl.to(phEls[1], { scale: 1, duration: 0.2, ease: "power2.inOut" }, w("l03", 8) + 0.08);
  const pb = phEls[1].querySelector(".pb58");
  gsap.set(pb, { transformOrigin: "0% 50%" });
  tl.to(pb, { scaleX: 1.12, duration: 0.1, ease: "power2.out" }, w("l03", 9));
  tl.to(pb, { scaleX: 1, duration: 0.25, ease: "elastic.out(1,0.4)" }, w("l03", 9) + 0.1);
  phEls.forEach((e, i) => tl.to(e, { y: (i % 2 ? -1 : 1) * 10, rotation: (i % 2 ? 1.2 : -1.2), duration: 1.0, ease: "none" }, 10.62));
  // push-in (power2.in) – photos stream out radially
  tl.to(p8z, { scale: 1.035, duration: w("l03", 10) - 0.02 - 10.6, ease: "none" }, 10.6);
  tl.to(p8z, { scale: 3.4, duration: 1.0, ease: "power2.in" }, w("l03", 10) - 0.02);
  cssBlur(p8z, 12.1, 0.5, 6);
}

// ═════════════════════════ S09–S11 — infinite zoom → logo → mask cascade ═════════════════════════
function S09() {
  const sc = q("s09");
  const stage = layer(sc);
  // chain outer→inner : [shape, colour, ratio-to-next]
  const chain = [
    ["sq", C.lav], ["dia", C.royal], ["sq", C.butter], ["hept", C.sky], ["sq", C.lemon], ["dia", C.mustard],
    ["sq", C.coral], ["sq", C.blush], ["dia", C.red], ["sq", C.cream],
    ["disc", C.lav], ["sq", C.royal], ["sq", C.sky], ["hept", "#FFFFFF"],
  ];
  const HEPT = 941; // heptagon width at settle (z = 0)
  const sizes = [];
  const logoR = { 13: 1, 12: 1.55, 11: 1.95, 10: 2.25, 9: 2.25 * 2.45 };
  for (let k = chain.length - 1; k >= 0; k--) sizes[k] = k >= 9 ? HEPT * logoR[k] : sizes[k + 1] * 2.35;
  const NAT = 1000;
  const els = chain.map(([shape, col], k) => {
    const e = bx(stage, 960, 540, NAT, NAT, `background:${col};` + (shape === "disc" ? "border-radius:50%;overflow:hidden;" : shape === "hept" ? `clip-path:${polyClip(7, NAT, 0.2)};` : "border-radius:26%;overflow:hidden;"));
    e.style.zIndex = k;
    return e;
